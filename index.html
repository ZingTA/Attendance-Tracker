<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Attendance Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar styling if mobile expands */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }
    
    /* Hide number spinner controls */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* Touch ergonomics */
    .touch-btn {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Support Dynamic Viewport Height */
    .dynamic-viewport {
      min-height: 100vh;
      min-height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
    }

    @media (max-width: 767px) {
      .dynamic-viewport {
        max-height: none;
        height: auto;
      }
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans selection:bg-indigo-500/30 dynamic-viewport flex flex-col antialiased relative overflow-x-hidden md:overflow-hidden p-2.5 sm:p-4">

  <!-- Ambient background glow effects -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>

  <!-- Main Container -->
  <div class="w-full max-w-6xl mx-auto flex-1 flex flex-col justify-between gap-2.5 sm:gap-3 min-h-0">

    <!-- Top Compact Status & Timestamp Toolbar (No header banner) -->
    <header class="shrink-0 bg-slate-900/70 border border-slate-800/90 rounded-2xl p-2.5 sm:px-4 sm:py-2.5 backdrop-blur-xl shadow-lg shadow-black/20 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">
      
      <!-- Last Entry Display -->
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-indigo-500/15 border border-indigo-500/25 text-indigo-400 flex items-center justify-center shrink-0">
          <i data-lucide="clock" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Last Entry</span>
            <span id="time-relative-chip" class="text-[9px] px-1.5 py-0.2 rounded font-mono font-medium bg-slate-800 text-indigo-300 border border-slate-700/60 hidden">Never</span>
          </div>
          <div id="last-entry-display" class="text-xs sm:text-sm font-semibold font-mono text-slate-200 truncate">
            No entries recorded yet
          </div>
        </div>
      </div>

      <!-- Aggregate Status Pill & Reset Button -->
      <div class="flex items-center justify-between sm:justify-end gap-2 sm:gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-800/80">
        <!-- Global Summary -->
        <div class="flex items-center gap-2 bg-slate-950/50 border border-slate-800/80 rounded-xl px-2.5 py-1 sm:py-1.5">
          <div class="flex flex-col text-right">
            <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Overall</span>
            <div class="flex items-center gap-1.5 font-mono">
              <span id="global-classes" class="text-xs font-semibold text-slate-300">0 classes</span>
              <span class="text-slate-600">·</span>
              <span id="global-pct" class="text-xs font-bold text-emerald-400">100%</span>
            </div>
          </div>
          <span id="global-badge" class="text-[9px] px-2 py-0.5 rounded font-bold uppercase tracking-wider bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
            Ok
          </span>
        </div>

        <!-- Reset Button -->
        <button id="btn-open-reset" class="touch-btn group flex items-center gap-1.5 px-3 py-1.5 sm:py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-rose-400 bg-slate-950/60 hover:bg-rose-500/10 border border-slate-800 hover:border-rose-500/30 transition-all duration-200 active:scale-95">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 transition-transform duration-300 group-hover:-rotate-90"></i>
          <span class="tracking-wide text-[11px] uppercase font-bold">Reset</span>
        </button>
      </div>
    </header>

    <!-- Subjects Grid / Cards View -->
    <!-- Desktop: grid-rows-5 inside 100vh | Mobile: ergonomic cards stack -->
    <div id="subjects-container" class="flex-1 flex flex-col md:grid md:grid-rows-5 gap-2.5 sm:gap-2.5 min-h-0 overflow-y-auto md:overflow-y-hidden pb-4 md:pb-0 pr-0.5">
      <!-- Dynamic Subject Rows populated by JS -->
    </div>

  </div>

  <!-- Reset Confirmation Modal -->
  <div id="reset-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="reset-modal-box" class="bg-[#0f1422] border border-slate-800 rounded-2xl p-5 sm:p-6 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-200">
      <div class="w-11 h-11 rounded-2xl bg-rose-500/15 text-rose-400 border border-rose-500/25 flex items-center justify-center mb-3.5">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
      </div>
      <h3 class="text-base font-bold text-white mb-1">Reset All Attendance?</h3>
      <p class="text-xs text-slate-400 leading-relaxed mb-5">
        This will clear attendance and absence records for all 5 subjects and reset the timestamp history. This action cannot be reversed.
      </p>
      <div class="flex items-center justify-end gap-2.5">
        <button id="btn-cancel-reset" class="touch-btn px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800/80 active:scale-95 transition-all">
          Cancel
        </button>
        <button id="btn-confirm-reset" class="touch-btn px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-600/30 active:scale-95 transition-all">
          Yes, Reset All
        </button>
      </div>
    </div>
  </div>

  <script>
    // 5 Specified Subjects
    const DEFAULT_SUBJECTS = [
      { id: 'fin', name: 'Finance', code: 'FIN', attended: 0, absent: 0, lastEntry: null },
      { id: 'mkt', name: 'Mkt Mgt', code: 'MKT', attended: 0, absent: 0, lastEntry: null },
      { id: 'law', name: 'Labor law', code: 'LAW', attended: 0, absent: 0, lastEntry: null },
      { id: 'mis', name: 'Mgt Info Sys', code: 'MIS', attended: 0, absent: 0, lastEntry: null },
      { id: 'sme', name: 'SME Mgt', code: 'SME', attended: 0, absent: 0, lastEntry: null }
    ];

    const STORAGE_KEY = 'attendance_tracker_v4_responsive';
    let state = loadInitialState();

    function loadInitialState() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          const subjects = DEFAULT_SUBJECTS.map(def => {
            const match = (parsed.subjects || []).find(p => p.id === def.id || p.name.toLowerCase() === def.name.toLowerCase());
            return {
              ...def,
              attended: match && typeof match.attended === 'number' ? Math.max(0, match.attended) : 0,
              absent: match && typeof match.absent === 'number' ? Math.max(0, match.absent) : 0,
              lastEntry: match && match.lastEntry ? match.lastEntry : null
            };
          });
          return {
            subjects,
            lastGlobalEntry: parsed.lastGlobalEntry || null
          };
        }
      } catch (e) {
        console.error('Storage reading error:', e);
      }
      return {
        subjects: JSON.parse(JSON.stringify(DEFAULT_SUBJECTS)),
        lastGlobalEntry: null
      };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Storage writing error:', e);
      }
    }

    function formatTimestamp(isoString) {
      if (!isoString) return 'No entries recorded yet';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return 'No entries recorded yet';
      return d.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      });
    }

    function getRelativeTimeString(isoString) {
      if (!isoString) return 'Never';
      const d = new Date(isoString);
      const diffSecs = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diffSecs < 5) return 'Just now';
      if (diffSecs < 60) return `${diffSecs}s ago`;
      const diffMins = Math.floor(diffSecs / 60);
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays}d ago`;
    }

    // Attendance calculation logic
    // Attendance % + Absent % = 100%
    // >= 80%: Ok
    // >= 70%: Be careful
    // < 70%: Warning
    function calculateStatus(attended, absent) {
      const total = attended + absent;
      if (total === 0) {
        return {
          pct: 100,
          total: 0,
          status: 'Ok',
          statusClass: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30',
          barColor: 'bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.35)]',
          forecast: '100% attendance · Safe buffer',
          shortForecast: 'Buffer: safe'
        };
      }

      const pct = (attended / total) * 100;

      if (pct >= 80) {
        // Safe buffer: how many consecutive classes can be missed while staying >= 80%
        // attended / (total + m) >= 0.8  =>  m <= (attended - 0.8*total) / 0.8
        const canMiss = Math.floor((attended - 0.8 * total) / 0.8);
        const forecast = canMiss > 0 
          ? `Safe buffer: can miss ${canMiss} ${canMiss === 1 ? 'class' : 'classes'}` 
          : `At 80% threshold · Cannot miss next class`;
        const shortForecast = canMiss > 0 ? `Can miss ${canMiss}` : `Cannot miss next`;

        return {
          pct,
          total,
          status: 'Ok',
          statusClass: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30',
          barColor: 'bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.35)]',
          forecast,
          shortForecast
        };
      } else if (pct >= 70) {
        // Next best is 80% (Ok)
        // (A + x) / (total + x) >= 0.8  =>  x >= ceil(4*B - A)
        const needed = Math.max(1, Math.ceil(4 * absent - attended));
        return {
          pct,
          total,
          status: 'Be careful',
          statusClass: 'bg-amber-500/15 text-amber-400 border border-amber-500/30',
          barColor: 'bg-amber-500 shadow-[0_0_12px_rgba(245,158,11,0.35)]',
          forecast: `Need ${needed} more ${needed === 1 ? 'class' : 'classes'} for Ok (80%)`,
          shortForecast: `Need ${needed} for Ok`
        };
      } else {
        // Next best is 70% (Be careful)
        // (A + x) / (total + x) >= 0.7  =>  x >= ceil((0.7*total - A) / 0.3)
        const needed = Math.max(1, Math.ceil((0.7 * total - attended) / 0.3));
        return {
          pct,
          total,
          status: 'Warning',
          statusClass: 'bg-rose-500/15 text-rose-400 border border-rose-500/30',
          barColor: 'bg-rose-500 shadow-[0_0_12px_rgba(244,63,94,0.35)]',
          forecast: `Need ${needed} more ${needed === 1 ? 'class' : 'classes'} for Be careful (70%)`,
          shortForecast: `Need ${needed} for 70%`
        };
      }
    }

    function recordActivity(index, type) {
      const now = new Date().toISOString();
      state.lastGlobalEntry = {
        timestamp: now,
        subjectName: state.subjects[index].name,
        type: type === 'attended' ? 'Attended' : 'Absent'
      };
      state.subjects[index].lastEntry = now;
      saveState();
      render();
    }

    window.incrementCount = function(index, type) {
      if (state.subjects[index]) {
        state.subjects[index][type] = (state.subjects[index][type] || 0) + 1;
        recordActivity(index, type);
      }
    };

    window.handleDirectInput = function(index, type, val) {
      const parsed = parseInt(val, 10);
      if (state.subjects[index]) {
        const newVal = isNaN(parsed) || parsed < 0 ? 0 : parsed;
        if (state.subjects[index][type] !== newVal) {
          state.subjects[index][type] = newVal;
          recordActivity(index, type);
        }
      }
    };

    function render() {
      const container = document.getElementById('subjects-container');
      container.innerHTML = '';

      let totalAttended = 0;
      let totalAbsent = 0;

      // Update Global Last Entry Header
      const lastEntryEl = document.getElementById('last-entry-display');
      const timeRelChip = document.getElementById('time-relative-chip');

      if (state.lastGlobalEntry && state.lastGlobalEntry.timestamp) {
        const fullTime = formatTimestamp(state.lastGlobalEntry.timestamp);
        lastEntryEl.innerHTML = `
          <span class="text-white font-bold">${fullTime}</span> 
          <span class="text-slate-400 font-medium hidden sm:inline">(${state.lastGlobalEntry.subjectName} · +1 ${state.lastGlobalEntry.type})</span>
        `;
        timeRelChip.textContent = getRelativeTimeString(state.lastGlobalEntry.timestamp);
        timeRelChip.classList.remove('hidden');
      } else {
        lastEntryEl.textContent = 'No entries recorded yet';
        timeRelChip.classList.add('hidden');
      }

      state.subjects.forEach((sub, idx) => {
        totalAttended += sub.attended;
        totalAbsent += sub.absent;

        const meta = calculateStatus(sub.attended, sub.absent);
        const subRelative = sub.lastEntry ? getRelativeTimeString(sub.lastEntry) : null;

        const card = document.createElement('div');
        // Desktop: sleek row inside h-screen grid. Mobile: touch-optimized card.
        card.className = `bg-slate-900/50 hover:bg-slate-900/80 border border-slate-800/80 rounded-2xl p-3 md:px-4 md:py-2 transition-all duration-200 backdrop-blur-md flex flex-col md:flex-row md:items-center justify-between gap-2.5 md:gap-4 shadow-sm hover:border-slate-700/80`;

        card.innerHTML = `
          <!-- Row 1 (Mobile) / Left Section (Desktop): Title, Badge, Code, Timestamp -->
          <div class="flex items-center justify-between md:w-[26%] min-w-0">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-slate-800/90 border border-slate-700/60 font-mono font-bold text-xs text-indigo-400 flex items-center justify-center shrink-0">
                ${sub.code}
              </div>
              <div class="min-w-0">
                <h3 class="text-xs md:text-sm font-bold text-slate-100 truncate">${sub.name}</h3>
                <div class="flex items-center gap-1.5 text-[10px] md:text-[11px] font-mono text-slate-400">
                  <span>Total: <strong class="text-slate-200">${sub.attended + sub.absent}</strong></span>
                  ${subRelative ? `<span class="text-slate-500 font-sans hidden sm:inline">· ${subRelative}</span>` : ''}
                </div>
              </div>
            </div>

            <!-- Mobile Only: Quick Status Badge & Rate in top header row -->
            <div class="flex items-center gap-1.5 md:hidden">
              <span class="text-xs font-mono font-extrabold text-white">${meta.pct.toFixed(0)}%</span>
              <span class="text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider ${meta.statusClass}">
                ${meta.status}
              </span>
            </div>
          </div>

          <!-- Controls Section: Only Plus Buttons & Inputs (Touch Ergonomic) -->
          <div class="grid grid-cols-2 gap-2 sm:gap-3 md:flex md:items-center md:gap-3 shrink-0">
            
            <!-- Attended Controls -->
            <div class="flex items-center justify-between bg-slate-950/70 border border-slate-800 rounded-xl p-1 sm:p-1.5 hover:border-emerald-500/40 transition-colors">
              <div class="flex items-center pl-1 sm:pl-1.5">
                <span class="text-[9px] md:text-[10px] font-extrabold text-emerald-400 uppercase tracking-wider pr-1">Attended</span>
                <input 
                  type="number" 
                  min="0" 
                  value="${sub.attended}" 
                  onchange="handleDirectInput(${idx}, 'attended', this.value)"
                  class="w-8 sm:w-10 h-7 md:h-6 bg-transparent text-center font-mono font-bold text-xs md:text-sm text-emerald-300 focus:outline-none focus:bg-slate-800/80 rounded"
                />
              </div>
              <button 
                onclick="incrementCount(${idx}, 'attended')" 
                title="Add 1 Attended class"
                class="touch-btn w-8 h-8 md:w-7 md:h-7 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/35 text-emerald-300 border border-emerald-500/30 flex items-center justify-center font-bold text-xs transition-all active:scale-90 shadow-sm shadow-emerald-500/10">
                <i data-lucide="plus" class="w-4 h-4 md:w-3.5 md:h-3.5 stroke-[2.5]"></i>
              </button>
            </div>

            <!-- Absent Controls -->
            <div class="flex items-center justify-between bg-slate-950/70 border border-slate-800 rounded-xl p-1 sm:p-1.5 hover:border-rose-500/40 transition-colors">
              <div class="flex items-center pl-1 sm:pl-1.5">
                <span class="text-[9px] md:text-[10px] font-extrabold text-rose-400 uppercase tracking-wider pr-1">Absent</span>
                <input 
                  type="number" 
                  min="0" 
                  value="${sub.absent}" 
                  onchange="handleDirectInput(${idx}, 'absent', this.value)"
                  class="w-8 sm:w-10 h-7 md:h-6 bg-transparent text-center font-mono font-bold text-xs md:text-sm text-rose-300 focus:outline-none focus:bg-slate-800/80 rounded"
                />
              </div>
              <button 
                onclick="incrementCount(${idx}, 'absent')" 
                title="Add 1 Absent class"
                class="touch-btn w-8 h-8 md:w-7 md:h-7 rounded-lg bg-rose-500/20 hover:bg-rose-500/35 text-rose-300 border border-rose-500/30 flex items-center justify-center font-bold text-xs transition-all active:scale-90 shadow-sm shadow-rose-500/10">
                <i data-lucide="plus" class="w-4 h-4 md:w-3.5 md:h-3.5 stroke-[2.5]"></i>
              </button>
            </div>

          </div>

          <!-- Progress Bar & Next Best Status Forecast -->
          <div class="flex-1 md:max-w-xs flex flex-col justify-center gap-1.5">
            <!-- Desktop percentage & Status header -->
            <div class="hidden md:flex items-center justify-between">
              <span class="text-xs md:text-sm font-extrabold font-mono text-white">${meta.pct.toFixed(0)}%</span>
              <span class="text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider ${meta.statusClass}">
                ${meta.status}
              </span>
            </div>

            <!-- Attendance Progress Bar (No absent percentage text) -->
            <div class="w-full h-2 md:h-2 bg-slate-950/80 rounded-full overflow-hidden p-0.5 border border-slate-800/60">
              <div class="${meta.barColor} h-full rounded-full transition-all duration-300" style="width: ${meta.pct}%"></div>
            </div>

            <!-- Forecast Text for next best status -->
            <div class="flex items-center justify-between gap-1 text-[10px] md:text-[11px] leading-tight">
              <span class="text-slate-300 font-medium truncate flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3 h-3 text-indigo-400 shrink-0"></i>
                <span class="hidden sm:inline">${meta.forecast}</span>
                <span class="sm:hidden">${meta.shortForecast}</span>
              </span>
              ${subRelative ? `<span class="text-[9px] font-mono text-slate-500 sm:hidden shrink-0">${subRelative}</span>` : ''}
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      // Overall calculations
      const grandTotal = totalAttended + totalAbsent;
      const grandMeta = calculateStatus(totalAttended, totalAbsent);

      document.getElementById('global-classes').textContent = `${grandTotal} classes`;
      document.getElementById('global-pct').textContent = `${grandMeta.pct.toFixed(0)}%`;
      const globalBadge = document.getElementById('global-badge');
      globalBadge.className = `text-[9px] px-2 py-0.5 rounded font-bold uppercase tracking-wider ${grandMeta.statusClass}`;
      globalBadge.textContent = grandMeta.status;

      lucide.createIcons();
    }

    // Reset Modal logic
    const modal = document.getElementById('reset-modal');
    const modalBox = document.getElementById('reset-modal-box');
    const openBtn = document.getElementById('btn-open-reset');
    const cancelBtn = document.getElementById('btn-cancel-reset');
    const confirmBtn = document.getElementById('btn-confirm-reset');

    function openModal() {
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-95');
      modalBox.classList.add('scale-100');
    }

    function closeModal() {
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-100');
      modalBox.classList.add('scale-95');
    }

    openBtn.addEventListener('click', openModal);
    cancelBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    confirmBtn.addEventListener('click', () => {
      state = {
        subjects: DEFAULT_SUBJECTS.map(s => ({ ...s, attended: 0, absent: 0, lastEntry: null })),
        lastGlobalEntry: null
      };
      saveState();
      render();
      closeModal();
    });

    // Auto-update relative timestamps every 30 seconds
    setInterval(() => {
      if (state.lastGlobalEntry && state.lastGlobalEntry.timestamp) {
        document.getElementById('time-relative-chip').textContent = getRelativeTimeString(state.lastGlobalEntry.timestamp);
      }
    }, 30000);

    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
